[package]
name = "mqtt-kafka-forwarding-rust"
version = "0.1.0"
edition = "2024"
default-run = "forwarder"

[[bin]]
doc = true
name = "forwarder"
path = "src/main.rs"

[profile.release]
opt-level = 3
panic = "abort"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"]}
rumqttc = "0.25.1"
rdkafka = {version="0.39.0", features=["ssl", "libz-static"]}
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.0"
yaml-rust = "0.4.5"
serde_json = "1.0.154"
log = "0.4.35"
ctrlc = "3.5.2"
base64 = "0.23.1"
axum = {version= "0.8.9" }
prometheus-client = "0.25.2"
lazy_static = "1.5.1"
env_logger = "0.11.11"


[workspace]
members = [
    "benchmark",
]
